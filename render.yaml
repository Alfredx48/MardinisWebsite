# Render Blueprint for the web service (React site + Rails API).
# The database lives on Supabase, so no Render database is created.
# Dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are prompted for on first deploy and never stored in git.
services:
  - type: web
    name: mardinis
    runtime: ruby
    plan: starter # always on; the free plan sleeps and makes the first visitor wait
    region: oregon
    branch: main
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      # Supabase "Session pooler" connection string (port 5432)
      - key: DATABASE_URL
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: NODE_VERSION
        value: "22"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
