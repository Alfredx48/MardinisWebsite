<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c1814" />
    <title>Offline · Mardini's Kitchen</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #1c1814; color: #fbf7f0; text-align: center;
        font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0 0 8px; font: 700 2rem Georgia, serif; }
      p { margin: 0 0 24px; color: #d8cfc2; }
      button {
        min-height: 56px; padding: 0 32px; border: 0; border-radius: 999px;
        background: #b4452c; color: #fff; font: 700 1.1rem system-ui, sans-serif; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>The kitchen screen can't reach the internet. Check the tablet's Wi-Fi.<br />This page retries every 15 seconds.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      setInterval(function () { if (navigator.onLine) location.reload(); }, 15000);
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
